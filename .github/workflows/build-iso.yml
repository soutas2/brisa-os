# Cria a pen de instalação (ISO) a partir da imagem já publicada.
# Corre só à mão: separador Actions → "Criar ISO" → Run workflow.
name: Criar ISO

on:
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Libertar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Nome da imagem
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/${NAME}:latest" >> "$GITHUB_ENV"

      - name: Preparar configuração do instalador
        run: sed -i "s|__IMAGE__|${IMAGE}|g" disk_config/iso.toml

      - name: Descarregar a imagem
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "${IMAGE}"

      - name: Criar ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./disk_config/iso.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --use-librepo=True \
            "${IMAGE}"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lhR output

      - name: Guardar ISO
        uses: actions/upload-artifact@v4
        with:
          name: brisa-os-iso
          path: output/bootiso/install.iso
          retention-days: 7
          compression-level: 0
